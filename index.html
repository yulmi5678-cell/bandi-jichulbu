<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>반디 방과후 활동 지출내역</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="반디지출부"><meta name="theme-color" content="#fdfbef">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 통장 같은 장부: 입력칸 하나 + 날짜순 줄글 목록. PC는 좌우 두 칸, 휴대폰은 위아래 한 칸. */
:root {
  --bg: #fdfbef; --surface: #ffffff; --fg: #2a2a22; --muted: #6c6b55; --line: #e8e4c8;
  --accent: #2f2c26; --accent-fg: #fff8d6; --accent-text: #6e5b0c; --accent-soft: #fbf1bd; --warn: #a2480f; --warn-soft: #fdeedd;
  --danger: #b3261e; --font: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --cute: "Jua", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1f1e1a; --surface: #2a2923; --fg: #f3f1e4; --muted: #b4b29c; --line: #423f33;
  --accent: #f4e6a2; --accent-fg: #2a2720; --accent-text: #f0dd8a; --accent-soft: #3b3620; --warn: #f0a673; --warn-soft: #3b2619;
  --danger: #f28b82; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #1f1e1a; --surface: #2a2923; --fg: #f3f1e4; --muted: #b4b29c; --line: #423f33;
  --accent: #f4e6a2; --accent-fg: #2a2720; --accent-text: #f0dd8a; --accent-soft: #3b3620; --warn: #f0a673; --warn-soft: #3b2619;
  --danger: #f28b82; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font: 400 16px/1.5 var(--font);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }
.wrap { max-width: 680px; margin: 0 auto; display: grid; gap: 20px; }
h1 { font: 400 24px/1.3 var(--cute); margin: 0; word-break: keep-all; text-wrap: balance; }
h2, .tabs button, .primary, .month strong, .sumline.big b, .sumline.big span, .autosum b { font-family: var(--cute) !important; font-weight: 400 !important; }
.sumline.big b { font-size: 32px !important; }
.sumline.big span { font-size: 17px !important; color: var(--fg) !important; }
.primary { font-size: 19px !important; }
h2 { font-size: 19px !important; }
.tabs button { font-size: 18px; }
select { width: 100%; min-width: 0; min-height: 46px; padding: 8px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; font: inherit; font-size: 16px; color: var(--fg); }
.ic { display: inline-flex; vertical-align: -3px; margin-right: 5px; }
.ic svg { width: 16px; height: 16px; }
.tabs .ic svg, .pay .ic svg { width: 18px; height: 18px; }
.empty svg { display: block; margin: 0 auto 8px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand img { width: 44px; height: 44px; object-fit: contain; border-radius: 8px; flex: none; }
.brand img[hidden] { display: none; }
.brand.editable img, .brand.editable h1 { cursor: pointer; }
.pencil { flex: none; width: 36px; height: 36px; padding: 0; display: inline-flex; align-items: center; justify-content: center; background: none; border: 0; color: var(--muted); }
.topbtns { display: flex; gap: 6px; flex-wrap: wrap; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 18px; display: grid; gap: 12px; max-width: 520px; width: 100%; }
.panel h2 { font-size: 16px; font-weight: 700; margin: 0; }
.panel p { margin: 0; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.logorow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.logorow img { width: 64px; height: 64px; object-fit: contain; border: 1px solid var(--line); border-radius: 8px; }
.logorow img[hidden] { display: none; }
input[type=file] { font-size: 14px; max-width: 100%; }
input[type=password] { width: 100%; min-width: 0; min-height: 46px; padding: 8px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; font-size: 16px; color: var(--fg); }
.switch { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 14px; color: var(--muted); }
.switch button { min-height: 38px; padding: 4px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; font-size: 14px; }
.switch button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 700; }
.layout.readonly { grid-template-columns: minmax(0, 1fr); max-width: 680px; }
.notice { margin: 0; padding: 10px 14px; border-radius: 14px; background: var(--warn-soft); color: var(--warn); font-size: 14px; font-weight: 500; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; align-items: start; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.tabs button { min-height: 48px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; font-weight: 500; }
.tabs button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 700; }

form { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
form h2 { font-size: 16px; font-weight: 700; margin: 0; }
label, .fieldname { display: grid; gap: 5px; font-size: 14px; font-weight: 500; color: var(--muted); }
input[type=date], input[type=text] { width: 100%; min-width: 0; min-height: 46px; padding: 8px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; font-size: 16px; color: var(--fg); }
.items { display: grid; gap: 6px; }
.itemrow { display: grid; grid-template-columns: minmax(0, 1fr) 5.2em 12px 3em 38px; gap: 4px; align-items: center; }
.itemhead { font-size: 13px; color: var(--muted); font-weight: 500; }
.itemrow .n { text-align: right; font-variant-numeric: tabular-nums; }
.times { text-align: center; color: var(--muted); }
.remove { width: 38px; height: 36px; padding: 0; background: none; border: 0; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; }
.addrow { justify-self: start; min-height: 40px; padding: 6px 12px; background: var(--accent-soft); color: var(--accent-text); border: 0; border-radius: 14px; font-size: 14px; font-weight: 700; }
.autosum { display: flex; justify-content: space-between; align-items: baseline; padding-top: 8px; border-top: 1px solid var(--line); }
.autosum b { font-size: 20px; font-variant-numeric: tabular-nums; }
.pay { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.pay button { min-height: 44px; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; font-weight: 500; }
.pay button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 700; }
.checks { display: flex; gap: 18px; flex-wrap: wrap; }
.check { display: flex; align-items: center; gap: 8px; min-height: 32px; color: var(--fg); font-size: 15px; font-weight: 400; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.primary { flex: 1 1 120px; min-height: 50px; border: 0; border-radius: 14px; background: var(--accent); color: var(--accent-fg); font-weight: 700; font-size: 17px; }
.plain { min-height: 44px; padding: 8px 14px; background: transparent; border: 1px solid var(--line); border-radius: 14px; }
.danger { color: var(--danger); }
.msg { margin: 0; font-size: 14px; min-height: 21px; color: var(--accent-text); }
.msg.err { color: var(--danger); }

.book { display: grid; gap: 14px; min-width: 0; }
.month { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.month strong { font-size: 18px; font-variant-numeric: tabular-nums; }
.arrow { width: 44px; height: 44px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; font-size: 18px; }
.sum { display: grid; gap: 6px; padding: 16px 18px; background: var(--accent-soft); border-radius: 22px; }
.sumline { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sumline b { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sumline.big b { font-size: 28px; }
.sum span { color: var(--muted); font-size: 14px; }
.sum .need { color: var(--warn); font-weight: 500; }
ul { list-style: none; margin: 0; padding: 0; }
li.row { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
.day { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.desc { font-weight: 500; overflow-wrap: anywhere; }
.amt { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.detail { grid-column: 2 / 4; display: grid; gap: 3px; margin: 4px 0; padding: 8px 10px; background: var(--surface); border-radius: 14px; font-size: 14px; }
.detail div { display: flex; justify-content: space-between; gap: 10px; }
.detail span:last-child { font-variant-numeric: tabular-nums; white-space: nowrap; }
.tools { grid-column: 2 / 4; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.tags, .acts { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.tag { display: inline-flex; align-items: center; min-height: 30px; padding: 3px 10px; border-radius: 99px; border: 0; font-size: 13px; font-weight: 500; }
.tag.yes { background: var(--accent-soft); color: var(--accent-text); }
.tag.no { background: var(--warn-soft); color: var(--warn); }
.tag.info { background: transparent; border: 1px solid var(--line); color: var(--fg); }
.link { min-height: 32px; padding: 3px 6px; background: none; border: 0; color: var(--muted); font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }
.empty { padding: 28px 0; color: var(--muted); text-align: center; }
.exports { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.export { font-weight: 500; }
@media (prefers-reduced-motion: no-preference) { button { transition: opacity .12s; } button:active { opacity: .7; } }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--bg); }
body { margin: 0; }
.pw { -webkit-text-security: disc; }
.login-wrap { max-width: 420px; width: 100%; margin: 6vh auto 0; }
</style>
</head><body>

<div class="wrap">
  <header class="top" id="top">
    <div class="brand" id="brand"><img id="logo" alt="" hidden><h1 id="appTitle"></h1><button class="pencil" id="editBrand" type="button" aria-label="제목과 로고 바꾸기"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1-4L16 5l3 3L8 19l-4 1zM14 7l3 3"/></svg></button></div>
    <div class="topbtns" id="topbtns">
      <button class="plain" id="shareBtn" type="button">공유하기</button>
      <button class="plain" id="pwBtn" type="button">비밀번호 바꾸기</button>
      <button class="plain" id="logoutBtn" type="button">로그아웃</button>
    </div>
  </header>
  <form class="panel login-wrap" id="loginPanel" hidden novalidate>
    <h2>로그인</h2>
    <label>아이디 <input type="text" id="loginId" autocomplete="username" placeholder="아이디" maxlength="15"></label>
    <label>비밀번호 <input type="text" class="pw" id="loginPw" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="비밀번호 (한글, 영어, 숫자 다 돼요)"></label>
    <div class="btns">
      <button class="primary" id="loginBtn" type="submit">로그인</button>
      <button class="plain" id="signupBtn" type="button">처음이에요 (새 장부 만들기)</button>
    </div>
    <p id="loginHelp">아이디가 다르면 장부도 따로예요. 처음이면 아이디와 비밀번호를 정해 적고 아래 버튼을 눌러 주세요.</p>
    <p class="msg err" id="loginMsg" role="alert"></p>
  </form>
  <section class="panel" id="settingsPanel" hidden>
    <h2>제목·로고 바꾸기</h2>
    <label>제목 <input type="text" id="titleInput" maxlength="40"></label>
    <div class="fieldname">로고
      <div class="logorow">
        <img id="logoPreview" alt="" hidden>
        <input type="file" id="logoFile" accept="image/*" aria-label="로고 사진 고르기">
        <button class="plain" id="logoRemove" type="button">로고 빼기</button>
      </div>
    </div>
    <div class="btns">
      <button class="primary" id="settingsSave" type="button">저장하기</button>
      <button class="plain" id="settingsCancel" type="button">취소하기</button>
    </div>
  </section>
  <section class="panel" id="pwPanel" hidden>
    <h2>비밀번호 바꾸기</h2>
    <label>새 비밀번호 <input type="text" class="pw" id="newPw" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="한글, 영어, 숫자 다 돼요"></label>
    <div class="btns">
      <button class="primary" id="pwSave" type="button">저장하기</button>
      <button class="plain" id="pwCancel" type="button">취소하기</button>
    </div>
    <p class="msg" id="pwMsg" role="status"></p>
  </section>
  <section class="panel" id="sharePanel" hidden>
    <h2>공유하기</h2>
    <p id="shareState"></p>
    <p id="shareLink"></p>
    <div class="btns">
      <button class="primary" id="shareCopy" type="button">주소 복사하기</button>
      <button class="plain" id="shareToggle" type="button"></button>
      <button class="plain" id="shareClose" type="button">닫기</button>
    </div>
  </section>
  <div class="tabs" id="tabs">
    <button type="button" data-page="write"><span class="ic" data-i="pencil"></span>지출 적기</button>
    <button type="button" data-page="book"><span class="ic" data-i="book"></span>월별 기록</button>
  </div>
  <div class="layout" id="layout">
    <form id="form" novalidate>
      <h2 id="formTitle">새 지출 적기</h2>
      <label>날짜 <input type="date" id="date" required></label>
      <label>내용 <select id="descPick"></select></label>
      <input type="text" id="desc" maxlength="100" placeholder="내용을 직접 적어 주세요" autocomplete="off" aria-label="내용 직접 입력" hidden>
      <div class="items">
        <div class="itemrow itemhead"><span>세부 항목</span><span class="n">1개 금액</span><span></span><span class="n">수량</span><span></span></div>
        <div class="items" id="items"></div>
        <button class="addrow" id="addRow" type="button">+ 항목 추가</button>
      </div>
      <div class="autosum"><span>이 결제 합계</span><b id="autoSum">0원</b></div>
      <div class="pay" id="pay" role="group" aria-label="결제 방법">
        <button type="button" data-pay="card" aria-pressed="false"><span class="ic" data-i="card"></span>카드</button>
        <button type="button" data-pay="cash" aria-pressed="false"><span class="ic" data-i="cash"></span>현금</button>
      </div>
      <div class="checks">
        <label class="check"><input type="checkbox" id="meal"> <span><span class="ic" data-i="meal"></span>식대</span></label>
        <label class="check"><input type="checkbox" id="receipt"> <span><span class="ic" data-i="receipt"></span>영수증 챙겼어요</span></label>
      </div>
      <div class="btns">
        <button class="primary" id="saveBtn" type="submit">저장하기</button>
        <button class="plain" id="cancelBtn" type="button" hidden>취소하기</button>
        <button class="plain danger" id="deleteBtn" type="button" hidden>삭제하기</button>
      </div>
      <p class="msg" id="msg" role="status"></p>
    </form>

    <section class="book" id="bookPage">
      <div class="month">
        <button class="arrow" id="prev" type="button" aria-label="이전 달">‹</button>
        <strong id="monthLabel"></strong>
        <button class="arrow" id="next" type="button" aria-label="다음 달">›</button>
      </div>
      <div class="sum">
        <div class="sumline"><span>합계(식대)</span><b id="mealTotal">0원</b></div>
        <div class="sumline"><span>합계(식대제외)</span><b id="otherTotal">0원</b></div>
        <div class="sumline"><span>카드</span><b id="cardTotal">0원</b></div>
        <div class="sumline"><span>현금</span><b id="cashTotal">0원</b></div>
        <div class="sumline" id="nopayLine" hidden><span>카드/현금 안 고른 것</span><b id="nopayTotal">0원</b></div>
        <div class="sumline big"><span>전체합계</span><b id="total">0원</b></div>
        <span id="count"></span>
      </div>
      <ul id="list"></ul>
      <div class="exports">
        <button class="plain export" id="exportBtn" type="button" hidden>이 달 엑셀로 받기</button>
        <button class="plain export" id="exportYearBtn" type="button" hidden></button>
      </div>
      <p class="msg" id="exportMsg" role="status"></p>
    </section>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, updatePassword } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, collection, onSnapshot, writeBatch } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { firebaseConfig } from "./config.js";

function resizeLogo(file) {
  return new Promise((ok, no) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, 256 / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); ok(c.toDataURL("image/png"));
    };
    img.onerror = no; img.src = url;
  });
}

function addItem(item = {}) {

      for (const i of named) {
        const line = document.createElement("div");
        const a = document.createElement("span"); a.textContent = i.name + (i.qty ? ` ${i.amount.toLocaleString("ko-KR")}원 × ${i.qty}` : "");
        const b = document.createElement("span"); b.textContent = won(lineSum(i));
        line.append(a, b); d.append(line);
      }
      li.append(d);
    }
    const tools = document.createElement("div"); tools.className = "tools";
    const tags = document.createElement("div"); tags.className = "tags";
    const info = (i, t) => { const s = document.createElement("span"); s.className = "tag info"; s.innerHTML = iconHtml(i); s.append(t); tags.append(s); };
    if (r.meal) info("meal", "식대");
    if (r.pay) info(r.pay, r.pay === "card" ? "카드" : "현금");
    const tag = document.createElement(view === "owner" ? "button" : "span"); if (view === "owner") tag.type = "button";
    tag.className = "tag " + (r.receipt ? "yes" : "no");
    tag.innerHTML = iconHtml("receipt"); tag.append(r.receipt ? "챙김" : "아직");
    if (view === "owner") tag.onclick = () => write(() => col.doc(r.id).update({ receipt: !r.receipt }));
    tags.append(tag);
    const acts = document.createElement("div"); acts.className = "acts";
    if (named.length) {
      const more = document.createElement("button"); more.type = "button"; more.className = "link";
      more.textContent = opened.has(r.id) ? "세부 닫기" : `세부 ${named.length}개 보기`;
      more.onclick = () => { opened.has(r.id) ? opened.delete(r.id) : opened.add(r.id); render(); };
      acts.append(more);
    }
    const edit = document.createElement("button"); edit.type = "button"; edit.className = "link"; edit.textContent = "고치기";
    edit.onclick = () => startEdit(r);
    if (view === "owner") acts.append(edit);
    tools.append(tags, acts);
    li.append(tools);
    ul.append(li);
  }
  fillDesc();
}

function startEdit(r) {
  setPage("write");
  editingId = r.id; deleteArmed = false;
  $("date").value = r.date; setDesc(r.desc);
  $("receipt").checked = !!r.receipt; $("meal").checked = !!r.meal;
  setPay(r.pay || null);
  $("items").replaceChildren();
  (r.items && r.items.length ? r.items : [{ name: "", amount: r.amount, qty: "" }]).forEach(addItem);
  updateAuto();
  $("formTitle").textContent = `${Number(r.date.slice(5, 7))}월 ${Number(r.date.slice(8))}일 지출 고치기`;
  $("saveBtn").textContent = "고친 내용 저장";
  $("cancelBtn").hidden = false; $("deleteBtn").hidden = false; $("deleteBtn").textContent = "삭제하기";
  say("");
  $("form").scrollIntoView({ block: "start", behavior: "smooth" });
}

async function write(fn, okText) {
  if (!col) { say("저장할 곳에 연결되지 않았어요. 인터넷을 확인하고 새로고침해 주세요.", true); return false; }
  try { await fn(); if (okText) say(okText); return true; }
  catch (e) {
    say(e && e.code === "quota_exceeded" ? "저장 공간이 가득 찼어요. 오래된 내역을 지운 뒤 다시 저장해 주세요." : "저장하지 못했어요. 인터넷을 확인하고 다시 눌러 주세요.", true);
    return false;
  }
}

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const date = $("date").value, desc = $("desc").value.trim();
  const items = readItems().filter(i => i.name || i.amount);
  if (!date) return say("날짜를 골라 주세요.", true);
  if (!desc) { $("desc").focus(); return say("내용을 고르거나 직접 적어 주세요.", true); }
  if (!items.length) return say("금액을 적어 주세요.", true);
  if (items.some(i => !i.amount)) return say("금액이 비어 있는 항목이 있어요. 금액을 적거나 휴지통을 눌러 지워 주세요.", true);
  const amount = items.reduce((s, i) => s + lineSum(i), 0);
  const body = { date, desc, amount, items, pay, receipt: $("receipt").checked, meal: $("meal").checked };
  const wasEditing = editingId;
  const ok = wasEditing
    ? await write(() => col.doc(wasEditing).update(body), "고친 내용을 저장했어요.")
    : await write(() => col.add({ ...body, createdAt: Date.now() }), "저장했어요.");
  if (ok) { month = date.slice(0, 7); resetForm(true); render(); if (wasEditing) setPage("book"); }
});

$("cancelBtn").onclick = () => { resetForm(); say(""); setPage("book"); };
$("tabs").addEventListener("click", e => { if (e.target.dataset.page) setPage(e.target.dataset.page); });
$("deleteBtn").onclick = async () => {
  if (!deleteArmed) { deleteArmed = true; $("deleteBtn").textContent = "한 번 더 누르면 삭제돼요"; return; }
  const id = editingId;
  if (await write(() => col.doc(id).delete(), "삭제했어요.")) { resetForm(); render(); setPage("book"); }
};

function shift(by) {
  const [y, m] = month.split("-").map(Number);
  const d = new Date(y, m - 1 + by, 1);
  month = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
  render();
}
$("prev").onclick = () => shift(-1);
$("next").onclick = () => shift(1);

function totals(list) {
  const all = sumOf(list), meal = sumOf(list.filter(r => r.meal));
  return { meal, other: all - meal, card: sumOf(list.filter(r => r.pay === "card")), cash: sumOf(list.filter(r => r.pay === "cash")), all };
}
function monthSheet(list, name) {
  const t = totals(list), payName = r => r.pay === "card" ? "카드" : r.pay === "cash" ? "현금" : "";
  const lines = [];
  for (const r of list) {
    const its = r.items && r.items.length ? r.items : [{ name: "", amount: r.amount, qty: "" }];
    for (const i of its) lines.push([r.date, r.desc, i.name, i.amount, i.qty === "" ? "" : Number(i.qty), lineSum(i), payName(r), r.meal ? "식대" : "그 외", r.receipt ? "O" : "X"]);
  }
  const foot = (n, v) => [n, "", "", "", "", v, "", "", ""];
  const rowsOut = [["날짜", "내용", "세부 항목", "1개 금액", "수량", "금액", "결제", "구분", "영수증"], ...lines,
    foot("합계(식대)", t.meal), foot("합계(식대제외)", t.other), foot("카드", t.card), foot("현금", t.cash), foot("전체합계", t.all)];
  return { name, rows: rowsOut, widths: [15, 30, 18, 10, 6, 12, 7, 7, 8], boldFrom: rowsOut.length - 5 };
}
const sortRows = list => [...list].sort((a, b) => a.date.localeCompare(b.date) || a.createdAt - b.createdAt);
function saveFile(blob, filename) {
  const a = document.createElement("a"), url = URL.createObjectURL(blob);
  a.href = url; a.download = filename; a.rel = "noopener"; document.body.append(a); a.click(); setTimeout(() => a.remove(), 1000);
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  $("exportMsg").classList.remove("err"); $("exportMsg").textContent = "엑셀 파일을 저장했어요.";
}
function exportFail() { $("exportMsg").classList.add("err"); $("exportMsg").textContent = "엑셀 파일을 만들지 못했어요. 잠시 뒤 다시 눌러 주세요."; }
$("exportBtn").onclick = () => {
  try { saveFile(buildXlsx([monthSheet(monthRows(), "지출내역")]), `지출내역_${month}.xlsx`); } catch { exportFail(); }
};
$("exportYearBtn").onclick = () => {
  try {
    const y = month.slice(0, 4), yearRows = rows.filter(r => r.date.startsWith(y));
    const line = (n, t) => [n, t.meal, t.other, t.card, t.cash, t.all];
    const body = [];
    for (let m = 1; m <= 12; m++) body.push(line(`${m}월`, totals(yearRows.filter(r => r.date.slice(0, 7) === `${y}-${pad(m)}`))));
    const sum = [["월", "합계(식대)", "합계(식대제외)", "카드", "현금", "전체합계"], ...body, line("연간 합계", totals(yearRows))];
    const sheets = [{ name: "연간 합계", rows: sum, widths: [10, 13, 15, 13, 13, 13], boldFrom: sum.length - 1 }];
    for (let m = 1; m <= 12; m++) {
      const list = sortRows(yearRows.filter(r => r.date.slice(0, 7) === `${y}-${pad(m)}`));
      if (list.length) sheets.push(monthSheet(list, `${m}월`));
    }
    saveFile(buildXlsx(sheets), `지출내역_${y}년.xlsx`);
  } catch { exportFail(); }
};

const enc = t => new TextEncoder().encode(t);
const hex = b => [...b].map(v => v.toString(16).padStart(2, "0")).join("");
const emailFor = id => `j${hex(enc(id.normalize("NFC").trim()))}@bandi.example.com`;
const fbPw = pw => { const p = pw.normalize("NFC"); return p.length >= 6 ? p : `bandi-${p}-pw`; };
const authMsg = e => {
  const c = e && e.code;
  if (c === "auth/email-already-in-use") return "이미 있는 아이디예요. 로그인 버튼을 눌러 주세요.";
  if (c === "auth/invalid-credential" || c === "auth/wrong-password" || c === "auth/user-not-found") return "아이디나 비밀번호가 맞지 않아요.";
  if (c === "auth/too-many-requests") return "여러 번 틀렸어요. 잠시 뒤 다시 해 주세요.";
  if (c === "auth/network-request-failed") return "인터넷 연결을 확인해 주세요.";
  return "로그인하지 못했어요. 잠시 뒤 다시 해 주세요.";
};
function stopAll() { unsub.forEach(u => u()); unsub = []; rows = []; loaded = false; }
function listen(id) {
  stopAll();
  bookId = id;
  const expenses = collection(fs, "jichulBooks", id, "expenses");
  col = {
    add: d => setDoc(doc(expenses), d),
    doc: k => ({ update: d => updateDoc(doc(expenses, k), d), delete: () => deleteDoc(doc(expenses, k)) })
  };
  const failed = () => { loaded = true; render(); (view === "owner" ? say : t => { $("exportMsg").classList.add("err"); $("exportMsg").textContent = t; })(view === "owner" ? "내역을 불러오지 못했어요. 페이지를 새로고침해 주세요." : "이 장부를 볼 수 없어요. 공유가 꺼져 있거나 주소가 맞지 않아요."); };
  unsub.push(onSnapshot(doc(fs, "jichulBooks", id), snap => {
    if (snap.exists()) { const d = snap.data(); book = { title: d.title, logo: d.logo || null, shareOn: !!d.shareOn }; applyBook(); if (!$("sharePanel").hidden) paintShare(); }
  }, failed));
  unsub.push(onSnapshot(expenses, snap => {
    rows = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (!snap.metadata.fromCache) loaded = true;
    render();
  }, failed));
}
async function bookIdFor(user) {
  const ownerRef = doc(fs, "jichulOwners", user.uid), o = await getDoc(ownerRef);
  if (o.exists()) return o.data().bookId;
  const ref = doc(collection(fs, "jichulBooks")), b = writeBatch(fs);
  b.set(ref, { owner: user.uid, title: "반디 방과후 활동 지출내역", logo: DEFAULT_LOGO, shareOn: false });
  b.set(ownerRef, { bookId: ref.id });
  await b.commit();
  return ref.id;
}
const shareUrl = () => `${location.origin}${location.pathname}?book=${bookId}`;
function paintShare() {
  $("shareState").textContent = book.shareOn ? "공유가 켜져 있어요. 이 주소를 아는 사람은 로그인 없이 내역을 볼 수 있고, 고칠 수는 없어요. 필요한 분께만 보내 주세요." : "공유가 꺼져 있어요. 켜면 주소를 아는 사람이 로그인 없이 내역을 볼 수 있어요.";
  $("shareLink").textContent = book.shareOn ? shareUrl() : "";
  $("shareCopy").hidden = !book.shareOn;
  $("shareToggle").textContent = book.shareOn ? "공유 끄기" : "공유 켜기";
}
const bookDoc = () => doc(fs, "jichulBooks", bookId);

const openSettings = () => { $("sharePanel").hidden = true; $("settingsPanel").hidden = false; $("titleInput").value = book.title; draftLogo = book.logo; $("logoFile").value = ""; showDraftLogo(); $("settingsPanel").scrollIntoView({ block: "nearest" }); };
$("brand").onclick = () => { if (view === "owner") openSettings(); };
$("settingsCancel").onclick = () => { $("settingsPanel").hidden = true; };
$("logoFile").onchange = async e => { const f = e.target.files[0]; if (!f) return; try { draftLogo = await resizeLogo(f); showDraftLogo(); } catch { say("이 사진은 쓸 수 없어요. 다른 사진을 골라 주세요.", true); } };
$("logoRemove").onclick = () => { draftLogo = null; $("logoFile").value = ""; showDraftLogo(); };
$("settingsSave").onclick = async () => {
  const next = { title: $("titleInput").value.trim() || book.title, logo: draftLogo };
  try { await updateDoc(bookDoc(), next); $("settingsPanel").hidden = true; }
  catch { $("settingsSave").textContent = "저장하지 못했어요. 다시 눌러 주세요"; setTimeout(() => { $("settingsSave").textContent = "저장하기"; }, 2000); }
};
$("shareBtn").onclick = () => { $("settingsPanel").hidden = true; $("sharePanel").hidden = false; paintShare(); };
$("shareClose").onclick = () => { $("sharePanel").hidden = true; };
$("shareToggle").onclick = async () => { const next = !book.shareOn; try { await updateDoc(bookDoc(), { shareOn: next }); book.shareOn = next; paintShare(); } catch { $("shareState").textContent = "바꾸지 못했어요. 인터넷을 확인하고 다시 눌러 주세요."; } };
$("shareCopy").onclick = async () => { try { await navigator.clipboard.writeText(shareUrl()); $("shareCopy").textContent = "복사했어요"; } catch { $("shareCopy").textContent = "복사하지 못했어요"; } setTimeout(() => { $("shareCopy").textContent = "주소 복사하기"; }, 1500); };
$("pwBtn").onclick = () => { $("settingsPanel").hidden = true; $("sharePanel").hidden = true; $("pwPanel").hidden = false; $("newPw").value = ""; $("pwMsg").textContent = ""; $("newPw").focus(); };
$("pwCancel").onclick = () => { $("pwPanel").hidden = true; };
$("pwSave").onclick = async () => {
  const m = $("pwMsg"), v = $("newPw").value;
  m.classList.add("err");
  if (!v) { m.textContent = "새 비밀번호를 적어 주세요."; return; }
  try {
    await updatePassword(auth.currentUser, fbPw(v));
    $("newPw").value = ""; m.classList.remove("err"); m.textContent = "비밀번호를 바꿨어요. 다음 로그인부터 새 비밀번호를 쓰세요.";
  } catch (e) {
    m.textContent = e && e.code === "auth/requires-recent-login" ? "로그인한 지 오래됐어요. 로그아웃하고 다시 로그인한 뒤 바꿔 주세요." : "바꾸지 못했어요. 인터넷을 확인하고 다시 눌러 주세요.";
  }
};
$("logoutBtn").onclick = () => signOut(auth);
const loginVals = () => {
  const id = $("loginId").value.trim(), pw = $("loginPw").value;
  if (!id || !pw) { $("loginMsg").textContent = "아이디와 비밀번호를 적어 주세요."; return null; }
  $("loginMsg").textContent = "";
  return { email: emailFor(id), pw: fbPw(pw) };
};
$("loginPanel").addEventListener("submit", async e => {
  e.preventDefault(); const v = loginVals(); if (!v) return;
  try { await signInWithEmailAndPassword(auth, v.email, v.pw); } catch (err) { $("loginMsg").textContent = authMsg(err); }
});
$("signupBtn").onclick = async () => {
  const v = loginVals(); if (!v) return;
  try { await createUserWithEmailAndPassword(auth, v.email, v.pw); } catch (err) { $("loginMsg").textContent = authMsg(err); }
};

applyBook();
resetForm();

const sharedBook = new URLSearchParams(location.search).get("book");
if (sharedBook) {
  setPage("book"); setView("viewer"); listen(sharedBook);
} else {
  setView("login");
  onAuthStateChanged(auth, async user => {
    if (!user) { stopAll(); col = null; bookId = null; $("loginPw").value = ""; setView("login"); return; }
    try {
      const id = await bookIdFor(user);
      $("loginMsg").textContent = "";
      setPage("write"); setView("owner"); listen(id);
    } catch { $("loginMsg").textContent = "장부를 열지 못했어요. 잠시 뒤 다시 해 주세요."; await signOut(auth); }
  });
}
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body></html>
